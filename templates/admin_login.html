<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Restaurant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(0,0,0,0.65),
                    rgba(0,0,0,0.65)
                ),
                url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4")
                center/cover no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        .admin-icon {
            font-size: 55px;
        }

        .brand {
            font-weight: 700;
            color: #212529;
        }

        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <div class="admin-icon">
            👨‍💼
        </div>

        <h2 class="brand">
            Admin Login
        </h2>

        <p class="text-muted">
            Restaurant Management System
        </p>

    </div>


    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Admin Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control form-control-lg"
                placeholder="Enter admin email"
                required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control form-control-lg"
                placeholder="Enter password"
                required>

        </div>


        <button
            type="submit"
            class="btn btn-dark btn-login w-100">

            🔐 Login as Admin

        </button>

    </form>


    <div class="text-center mt-4">

        <a
            href="{{ url_for('home') }}"
            class="text-decoration-none">

            ← Back to Home

        </a>

    </div>

</div>

</body>

</html>
